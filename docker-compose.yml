services:
  mongodb:
    image: mongo:7.0
    container_name: chat-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db # Đảm bảo tin nhắn không bị mất khi Docker restart
    restart: always

  redis:
    image: redis:alpine
    container_name: chat-redis
    ports:
      - "6379:6379"
    restart: always

  minio:
    image: minio/minio
    container_name: chat-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    volumes:
      - minio_data:/data # Bảo toàn file PDF và Ảnh vĩnh viễn[cite: 5]
    command: server /data --console-address ":9001"
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  mongo_data:
  minio_data:
